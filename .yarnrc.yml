approvedGitRepositories:
  - "**"

checksumBehavior: throw

enableScripts: false

nodeLinker: pnpm

npmMinimalAgeGate: 0

npmScopes:
  wikibonsai:
    npmRegistryServer: "https://registry.npmjs.org"

# pnp/pnpm strictness: mocha loads ts-node/register per .mocharc.json but does
# not declare it; extend its manifest so the require chain is sound.
packageExtensions:
  "mocha@*":
    dependencies:
      ts-node: "*"
      typescript: "*"
